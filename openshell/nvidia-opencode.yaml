id: nvidia-opencode
display_name: NVIDIA API for OpenCode
description: NVIDIA inference access restricted to the OpenCode runtime
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: NVIDIA API key
    env_vars:
      - NVIDIA_API_KEY
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials:
    - api_key

endpoints:
  - host: integrate.api.nvidia.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/opencode
