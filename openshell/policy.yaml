version: 1

filesystem_policy:
  include_workdir: false

  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc

    - /workspace/app

    - /workspace/TASK.md
    - /workspace/README.md

    - /workspace/hackathon/input

  read_write:
    - /workspace/hackathon/output
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

network_policies:
  local_llm:
    name: Local NVIDIA LLM

    endpoints:
      - host: host.openshell.internal
        port: 8000
        protocol: rest
        enforcement: enforce

        rules:
          - allow:
              method: POST
              path: /v1/chat/completions

    binaries:
      - path: /usr/local/bin/opencode

  local_llm_qwen:
    name: Local Qwen3-Next LLM

    endpoints:
      - host: host.openshell.internal
        port: 8001
        protocol: rest
        enforcement: enforce

        rules:
          - allow:
              method: POST
              path: /v1/chat/completions

    binaries:
      - path: /usr/local/bin/opencode
